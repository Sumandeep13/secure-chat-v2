<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CipherChat | End-to-End Encrypted Messaging</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .card { background: white; width: 420px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    h2 { text-align: center; color: #222; margin-top: 0; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #666; font-size: 12px; margin-bottom: 16px; }
    .tabs { display: flex; margin-bottom: 15px; border-bottom: 2px solid #eee; }
    .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #666; }
    .tab.active { color: #007bff; border-bottom: 2px solid #007bff; margin-bottom: -2px; }
    input, select, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    button { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #0056b3; }
    .btn-logout { background: #dc3545; padding: 6px 12px; width: auto; font-size: 12px; float: right; margin: 0; }
    .btn-logout:hover { background: #a71d2a; }
    #chat-box { height: 260px; border: 1px solid #e0e0e0; background: #fafafa; border-radius: 8px; overflow-y: auto; padding: 12px; margin: 10px 0; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 9px 13px; border-radius: 15px; max-width: 80%; word-break: break-word; font-size: 14px; line-height: 1.4; }
    .sent { background: #dcf8c6; align-self: flex-end; margin-left: auto; border-bottom-right-radius: 4px; }
    .received { background: #ffffff; border: 1px solid #e0e0e0; align-self: flex-start; border-bottom-left-radius: 4px; }
    .status { font-size: 12px; color: #2e7d32; background: #e8f5e9; padding: 6px; border-radius: 6px; font-weight: bold; text-align: center; margin-bottom: 12px; }
    .error-msg { color: #d32f2f; font-size: 13px; text-align: center; margin-top: 5px; }
    .success-msg { color: #2e7d32; font-size: 13px; text-align: center; margin-top: 5px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🔒 CipherChat</h2>
    <div class="subtitle">Private End-to-End Encrypted Messaging</div>

    <!-- AUTHENTICATION PANEL -->
    <div id="auth-panel">
      <div class="tabs">
        <div id="tab-login" class="tab active" onclick="switchTab('login')">Login</div>
        <div id="tab-register" class="tab" onclick="switchTab('register')">Register</div>
      </div>

      <!-- LOGIN FORM -->
      <div id="login-form">
        <input type="text" id="login-username" placeholder="Username">
        <input type="password" id="login-password" placeholder="Password">
        <button id="login-btn" onclick="handleLogin()">Sign In & Generate Keys</button>
      </div>

      <!-- REGISTER FORM -->
      <div id="register-form" style="display: none;">
        <input type="text" id="reg-username" placeholder="Choose a Username">
        <input type="password" id="reg-password" placeholder="Create a Password">
        <button id="reg-btn" onclick="handleRegister()">Create CipherChat Account</button>
      </div>

      <div id="auth-feedback"></div>
    </div>

    <!-- CHAT PANEL -->
    <div id="chat-panel" style="display: none;">
      <div class="status">🔒 End-to-End Encrypted (RSA-OAEP + AES-256-GCM)</div>
      <div style="margin-bottom: 10px; overflow: hidden;">
        <span>Logged in as: <b id="user-display"></b> <span style="color: green; font-size: 12px;">● Online</span></span>
        <button class="btn-logout" onclick="location.reload()">Logout</button>
      </div>
      
      <label style="font-size: 13px;"><b>Select Recipient:</b></label>
      <select id="contact-select">
        <option value="">Waiting for contacts...</option>
      </select>

      <div id="chat-box"></div>

      <input type="text" id="message-input" placeholder="Type an encrypted message..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Send Encrypted Message</button>
    </div>
  </div>

  <script>
    const socket = io();
    let myUsername = '';
    let myKeyPair = null;
    let publicKeysMap = {};

    // Switch between Login and Register tabs
    function switchTab(mode) {
      document.getElementById('auth-feedback').innerHTML = '';
      if (mode === 'login') {
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-register').classList.remove('active');
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('register-form').style.display = 'none';
      } else {
        document.getElementById('tab-register').classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('register-form').style.display = 'block';
        document.getElementById('login-form').style.display = 'none';
      }
    }

    // Handle User Registration
    async function handleRegister() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value.trim();
      const feedback = document.getElementById('auth-feedback');

      if (!username || !password) {
        feedback.innerHTML = '<div class="error-msg">Please fill in all fields.</div>';
        return;
      }

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          switchTab('login');
          document.getElementById('login-username').value = username;
          feedback.innerHTML = '<div class="success-msg">Account created! Please sign in.</div>';
        } else {
          feedback.innerHTML = `<div class="error-msg">${data.error}</div>`;
        }
      } catch (err) {
        feedback.innerHTML = '<div class="error-msg">Network error during registration.</div>';
      }
    }

    // Handle User Login & E2EE Key Setup
    async function handleLogin() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const feedback = document.getElementById('auth-feedback');
      const btn = document.getElementById('login-btn');

      if (!username || !password) {
        feedback.innerHTML = '<div class="error-msg">Please enter username and password.</div>';
        return;
      }

      btn.innerText = 'Authenticating...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          btn.innerText = 'Sign In & Generate Keys';
          feedback.innerHTML = `<div class="error-msg">${data.error}</div>`;
          return;
        }

        btn.innerText = 'Generating RSA Keys...';
        myUsername = data.username;

        // Generate RSA-OAEP Key Pair
        myKeyPair = await generateKeyPair();
        const exportedPubKey = await exportPublicKey(myKeyPair.publicKey);

        // Register active session & public key on Socket.IO
        socket.emit('register_user', { username: myUsername, publicKey: exportedPubKey });

        document.getElementById('auth-panel').style.display = 'none';
        document.getElementById('chat-panel').style.display = 'block';
        document.getElementById('user-display').innerText = myUsername;
      } catch (err) {
        btn.innerText = 'Sign In & Generate Keys';
        feedback.innerHTML = '<div class="error-msg">Connection error.</div>';
      }
    }

    // Buffer Utilities
    function bufferToBase64(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)));
    }

    function base64ToBuffer(base64) {
      const binaryString = atob(base64);
      const bytes = new Uint8Array(binaryString.length);
      for (let i = 0; i < binaryString.length; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // Generate RSA-OAEP Key Pair
    async function generateKeyPair() {
      return await window.crypto.subtle.generateKey(
        {
          name: "RSA-OAEP",
          modulusLength: 2048,
          publicExponent: new Uint8Array([1, 0, 1]),
          hash: "SHA-256",
        },
        true,
        ["encrypt", "decrypt"]
      );
    }

    // Export SPKI Public Key
    async function exportPublicKey(key) {
      const exported = await window.crypto.subtle.exportKey("spki", key);
      return bufferToBase64(exported);
    }

    // Import Recipient Public Key
    async function importPublicKey(pemBase64) {
      const buffer = base64ToBuffer(pemBase64);
      return await window.crypto.subtle.importKey(
        "spki",
        buffer,
        { name: "RSA-OAEP", hash: "SHA-256" },
        true,
        ["encrypt"]
      );
    }

    // Update Active Contact List
    socket.on('update_user_list', async (usersData) => {
      const select = document.getElementById('contact-select');
      const currentSelection = select.value;
      select.innerHTML = '';
      publicKeysMap = {};

      for (let username in usersData) {
        if (username !== myUsername && usersData[username]) {
          const pubKeyString = typeof usersData[username] === 'string' 
            ? usersData[username] 
            : usersData[username].publicKey;

          if (pubKeyString) {
            publicKeysMap[username] = await importPublicKey(pubKeyString);
            const opt = document.createElement('option');
            opt.value = username;
            opt.innerText = username;
            select.appendChild(opt);
          }
        }
      }

      if (select.options.length === 0) {
        const opt = document.createElement('option');
        opt.value = "";
        opt.innerText = "No other users online yet";
        select.appendChild(opt);
      } else if (currentSelection && publicKeysMap[currentSelection]) {
        select.value = currentSelection;
      }
    });

    // Encrypt and Send Message (AES-256-GCM + RSA-OAEP)
    async function sendMessage() {
      const recipient = document.getElementById('contact-select').value;
      const text = document.getElementById('message-input').value.trim();

      if (!recipient) return alert('Please select an online recipient.');
      if (!text) return;

      const recipientPubKey = publicKeysMap[recipient];
      if (!recipientPubKey) return alert('Recipient public key not available.');

      const aesKey = await window.crypto.subtle.generateKey(
        { name: "AES-GCM", length: 256 },
        true,
        ["encrypt", "decrypt"]
      );
      const iv = window.crypto.getRandomValues(new Uint8Array(12));

      const encodedText = new TextEncoder().encode(text);
      const encryptedData = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        aesKey,
        encodedText
      );

      const exportedAesKey = await window.crypto.subtle.exportKey("raw", aesKey);
      const encryptedAesKey = await window.crypto.subtle.encrypt(
        { name: "RSA-OAEP" },
        recipientPubKey,
        exportedAesKey
      );

      socket.emit('send_encrypted_message', {
        recipient: recipient,
        sender: myUsername,
        encryptedData: bufferToBase64(encryptedData),
        encryptedKey: bufferToBase64(encryptedAesKey),
        iv: bufferToBase64(iv)
      });

      appendMessage(`Me: ${text}`, 'sent');
      document.getElementById('message-input').value = '';
    }

    // Receive and Decrypt Message
    socket.on('receive_encrypted_message', async (data) => {
      try {
        const encryptedDataBuf = base64ToBuffer(data.encryptedData);
        const encryptedKeyBuf = base64ToBuffer(data.encryptedKey);
        const ivBuf = base64ToBuffer(data.iv);

        const decryptedAesKeyRaw = await window.crypto.subtle.decrypt(
          { name: "RSA-OAEP" },
          myKeyPair.privateKey,
          encryptedKeyBuf
        );

        const aesKey = await window.crypto.subtle.importKey(
          "raw",
          decryptedAesKeyRaw,
          "AES-GCM",
          true,
          ["decrypt"]
        );

        const decryptedMessageBuf = await window.crypto.subtle.decrypt(
          { name: "AES-GCM", iv: new Uint8Array(ivBuf) },
          aesKey,
          encryptedDataBuf
        );

        const plaintext = new TextDecoder().decode(decryptedMessageBuf);
        appendMessage(`${data.sender}: ${plaintext}`, 'received');
      } catch (err) {
        console.error('Decryption failed:', err);
        appendMessage(`${data.sender}: [Decryption Error]`, 'received');
      }
    });

    function appendMessage(text, type) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
